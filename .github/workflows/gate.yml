name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: munzzyy/ci-safety-gate@f1f0ca65c2f1cadb1ac2727ac789a9ac66027a63 # main, zizmor + skillxray + secrets
